<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasibulla Live TV - FIFA World Cup Premium</title>
    <!-- Tailwind CSS CDN for Styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Video.js CSS for Player -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        /* ভিডিও ফ্রেম লক ও প্রিমিয়াম কার্ভড ইফেক্ট */
        .video-js video {
            object-fit: fill !important;
        }
        /* স্পোর্টস ওএস স্টাইল কন্ট্রোল বার */
        .video-js .vjs-control-bar {
            display: flex !important;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.4)) !important;
        }
        /* গ্লোয়িং টেক্সট ইফেক্ট */
        .glow-text {
            text-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 font-sans antialiased selection:bg-amber-500 selection:text-black">

    <!-- 🏆 প্রফেশনাল ফিফা স্টাইল হেডার এবং লোগো -->
    <header class="relative bg-gradient-to-r from-[#0d1527] via-[#16223f] to-[#0d1527] p-6 text-center border-b border-amber-500/20 shadow-2xl">
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
        <div class="relative flex flex-col items-center justify-center gap-2">
            <!-- ফিফা অফিশিয়াল লোগো ভেক্টর -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/aa/FIFA_logo_without_slogan.svg" alt="FIFA Logo" class="h-8 md:h-10 brightness-200 drop-shadow-lg">
            <h1 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500 tracking-wider uppercase glow-text mt-1">
                Hasibulla Live TV
            </h1>
            <div class="flex items-center gap-2 bg-rose-600/20 border border-rose-500/30 px-3 py-1 rounded-full mt-1">
                <span class="w-2 h-2 bg-rose-500 rounded-full animate-pulse"></span>
                <p class="text-[11px] font-bold tracking-widest text-rose-400 uppercase">FIFA World Cup Special Portal</p>
            </div>
        </div>
    </header>

    <!-- মূল কনটেন্ট এরিয়া -->
    <main class="container mx-auto px-4 py-8 max-w-6xl">
        
        <!-- 📺 প্রিমিয়াম ভিডিও প্লেয়ার ডেকোরেশন -->
        <div class="flex justify-center mb-8">
            <div class="w-full lg:w-4/5 max-w-3xl bg-black rounded-2xl overflow-hidden shadow-[0_10px_50px_rgba(0,0,0,0.8)] border-2 border-slate-800/80 hover:border-amber-500/40 transition-all duration-500">
                <video id="my-tv-player" class="video-js vjs-default-skin vjs-big-play-centered vjs-fluid" controls preload="auto" data-setup='{"fluid": true, "aspectRatio": "16:9"}'>
                    <p class="vjs-no-js">এই ভিডিওটি দেখতে ব্রাউজারে জাভাস্ক্রিপ্ট অন করুন।</p>
                </video>
            </div>
        </div>

        <!-- 🔍 আধুনিক গ্লাসমরফিজম সার্চ বার -->
        <div id="search-container" class="mb-10 max-w-md mx-auto relative group">
            <div class="absolute inset-0 bg-gradient-to-r from-amber-500 to-rose-500 rounded-full blur opacity-25 group-hover:opacity-40 transition duration-300"></div>
            <input type="text" id="search-box" oninput="filterChannels()" placeholder="চ্যানেল বা খেলার নাম দিয়ে সার্চ করুন..." class="relative w-full px-6 py-3.5 rounded-full bg-[#131a2e] border border-slate-700 text-white focus:outline-none focus:border-amber-500 placeholder-gray-500 text-sm shadow-2xl transition-all duration-300">
        </div>

        <hr class="border-slate-800/60 my-8">

        <!-- লাইভ চ্যানেল কাউন্টার ব্যাজ -->
        <div class="mb-6 flex items-center justify-between bg-[#131a2e]/60 border border-slate-800 px-4 py-2.5 rounded-xl max-w-xs">
            <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">অবস্থা: অনলাইন</span>
            <div class="text-sm font-medium text-gray-300">
                🎯 উপলব্ধ চ্যানেল: <span id="channel-count" class="text-amber-400 font-bold bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20">০</span> টি
            </div>
        </div>

        <!-- 🔄 লোডিং স্পিনার (স্পোর্টস থিমড) -->
        <div id="loading" class="text-center py-16 text-gray-400 bg-[#131a2e]/30 rounded-2xl border border-slate-800/50">
            <div class="animate-spin inline-block w-10 h-10 border-4浏览 border-amber-500 border-t-transparent rounded-full mb-3 shadow-[0_0_15px_rgba(245,158,11,0.2)]"></div>
            <p class="text-sm font-medium text-slate-400 tracking-wide">স্পোর্টস নেটওয়ার্কের সাথে যুক্ত হচ্ছে...</p>
        </div>

        <!-- 🔥 ১. শীর্ষ চ্যানেল সেকশন (পিনড) -->
        <div id="pinned-section" class="mb-12 hidden">
            <h2 class="text-lg font-black mb-5 text-amber-400 flex items-center gap-2 border-l-4 border-amber-400 pl-3 tracking-wide uppercase">
                ⭐ শীর্ষ চ্যানেল (Featured Networks)
            </h2>
            <div id="pinned-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <!-- বাটনগুলো স্ক্রিপ্ট দিয়ে তৈরি হবে -->
            </div>
        </div>

        <!-- ⚽ ২. ডাইনামিক ক্যাটাগরি সেকশন -->
        <div id="categories-container" class="space-y-12 hidden">
            <!-- এখানে আলাদা আলাদা ক্যাটাগরির সারি তৈরি হবে -->
        </div>

    </main>

    <!-- ফুটার সেকশন -->
    <footer class="text-center py-6 text-slate-500 text-xs border-t border-slate-900 bg-[#070a12] mt-20 tracking-wider">
        &copy; 2026 <span class="text-amber-500 font-semibold">Hasibulla Live TV</span>. Powered by Open Source Sports IPTV.
    </footer>

    <!-- Video.js Script CDN -->
    <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>
    
    <!-- কাস্টম জাভাস্ক্রিপ্ট লজিক (সম্পূর্ণ অক্ষুণ্ণ ও ফিক্সড করা) -->
    <script>
        const playlistUrl = 'https://raw.githubusercontent.com/imShakil/tvlink/refs/heads/main/iptv.m3u8';
        
        let allChannels = []; 
        let globalPinned = [];
        let globalCategories = {};
        var player = videojs('my-tv-player');

        function getCleanLogo(name, existingLogo) {
            const nameLower = name.toLowerCase();
            
            const logoMap = {
                't sports': 'https://upload.wikimedia.org/wikipedia/commons/e/e0/T_Sports_logo.png',
                'somoy': 'https://upload.wikimedia.org/wikipedia/commons/e/ea/Somoy_TV_Logo.png',
                'btv national': 'https://upload.wikimedia.org/wikipedia/commons/8/82/Bangladesh_Television_logo.png',
                'btv': 'https://upload.wikimedia.org/wikipedia/commons/8/82/Bangladesh_Television_logo.png',
                'nagorik': 'https://upload.wikimedia.org/wikipedia/commons/3/30/Nagorik_TV_logo.png',
                'gazi': 'https://upload.wikimedia.org/wikipedia/en/3/3d/Gazi_TV_logo.png',
                'gtv': 'https://upload.wikimedia.org/wikipedia/en/3/3d/Gazi_TV_logo.png',
                'willow': 'https://upload.wikimedia.org/wikipedia/commons/d/d3/Willow_TV_logo.png',
                'premier league': 'https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg.png',
                'jamuna': 'https://upload.wikimedia.org/wikipedia/commons/a/ad/Jamuna_TV_logo.png',
                'atn bangla': 'https://upload.wikimedia.org/wikipedia/commons/b/be/ATN_Bangla_logo.png'
            };

            for (let key in logoMap) {
                if (nameLower.includes(key)) {
                    return logoMap[key];
                }
            }

            if (existingLogo && (existingLogo.includes('iptv.live') || existingLogo.includes('placeholder') || existingLogo.includes('sports-logo') || existingLogo.includes('tvlink'))) {
                return ''; 
            }

            return existingLogo;
        }

        async function initPortal() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);

                const response = await fetch(playlistUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.text();
                parseM3UAndCategorize(data);
            } catch (error) {
                console.error("Main list failed, loading fallback...", error);
                loadFallbackChannels();
            }
        }

        function parseM3UAndCategorize(data) {
            const lines = data.split('\n');
            let currentChannel = {};
            
            const priorityKeywords = ['t sports', 'btv', 'somoy tv', 'i screen', 'iscreen'];
            let pinnedChannels = [];
            let categories = {};

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,(.+)$/);
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    
                    currentChannel.name = nameMatch ? nameMatch[1].trim() : 'Unknown Channel';
                    let rawLogo = logoMatch ? logoMatch[1] : '';
                    
                    currentChannel.logo = getCleanLogo(currentChannel.name, rawLogo);
                    
                    let category = groupMatch ? groupMatch[1].trim() : 'অন্যান্য';
                    
                    const nameLower = (currentChannel.name || '').toLowerCase();
                    const catLower = (category || '').toLowerCase();
                    
                    if (nameLower.includes('sport') || nameLower.includes('cricket') || nameLower.includes('football') || nameLower.includes('sony') || nameLower.includes('star') || nameLower.includes('ten') || nameLower.includes('gtv') || nameLower.includes('gazi') || catLower.includes('sport') || nameLower.includes('willow')) {
                        category = '⚽ খেলাধুলা (Sports)';
                    } else if (catLower.includes('news') || nameLower.includes('news') || nameLower.includes('somoy')) {
                        category = '📰 সংবাদ (News)';
                    } else if (catLower.includes('entertainment') || catLower.includes('general') || nameLower.includes('nagorik')) {
                        category = '🎬 বিনোদন (Entertainment)';
                    } else if (category === 'অন্যান্য' || catLower.includes('others')) {
                        category = '📺 অন্যান্য চ্যানেল';
                    }
                    
                    currentChannel.category = category;

                } else if (line.startsWith('http')) {
                    currentChannel.url = line;
                    const nameLower = (currentChannel.name || '').toLowerCase();
                    
                    const isPriority = priorityKeywords.some(keyword => nameLower.includes(keyword));
                    if (isPriority) {
                        if (!pinnedChannels.some(c => c.name.toLowerCase() === nameLower)) {
                            pinnedChannels.push({...currentChannel});
                        }
                    }

                    if (!categories[currentChannel.category]) {
                        categories[currentChannel.category] = [];
                    }
                    categories[currentChannel.category].push({...currentChannel});

                    currentChannel = {}; 
                }
            }
            
            globalPinned = pinnedChannels;
            globalCategories = categories;

            renderUI();
        }

        function renderUI() {
            document.getElementById('loading').classList.add('hidden');

            if (globalPinned.length > 0) {
                document.getElementById('pinned-section').classList.remove('hidden');
                displayGrid(globalPinned, 'pinned-grid');
            }

            document.getElementById('categories-container').classList.remove('hidden');
            renderCategories(globalCategories);

            if (globalPinned.length > 0) {
                changeChannel(globalPinned[0].url);
            }
        }

        function loadFallbackChannels() {
            const fallbackM3U = `#EXTM3U\n` +
                `#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/e/e0/T_Sports_logo.png" group-title="⚽ খেলাধুলা (Sports)",T Sports\n` +
                `https://mstdn.live/tsports/index.m3u8n` +
                `#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/8/82/Bangladesh_Television_logo.png" group-title="📺 অন্যান্য চ্যানেল",BTV\n` +
                `https://mstdn.live/btv/index.m3u8n` +
                `#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/e/ea/Somoy_TV_Logo.png" group-title="📰 সংবাদ (News)",Somoy TV\n` +
                `https://mstdn.live/somoy/index.m3u8n` +
                `#EXTINF:-1 tvg-logo="" group-title="🎬 বিনোদন (Entertainment)",i Screen\n` +
                `https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8`;

            parseM3UAndCategorize(fallbackM3U);

            const alertBox = document.createElement('div');
            alertBox.className = "bg-amber-600 text-white text-xs text-center py-2 rounded-lg mb-4 font-medium";
            alertBox.innerText = "⚠️ ভিপিএন বা নেটওয়ার্ক সমস্যার কারণে ব্যাকআপ চ্যানেল লিস্ট সচল করা হয়েছে।";
            document.getElementById('search-container').insertBefore(alertBox, document.getElementById('search-box'));
        }

        // 🎨 স্পোর্টস কার্ড ডিজাইন আপগ্রেড
        function createChannelButton(channel) {
            const btn = document.createElement('button');
            // বাটনগুলোতে লাক্সারি ডার্ক গ্লাস ইফেক্ট এবং গ্লোয়িং বর্ডার ট্রানজিশন যোগ করা হয়েছে
            btn.className = "group relative bg-gradient-to-b from-[#131a2e] to-[#0e1322] p-4 rounded-xl flex flex-col items-center justify-center border border-slate-800/80 hover:border-amber-500 hover:shadow-[0_0_15px_rgba(245,158,11,0.15)] hover:scale-[1.04] transition-all duration-300 cursor-pointer text-center w-full";
            btn.onclick = () => changeChannel(channel.url);

            let logoHtml = `<div class="w-14 h-14 bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl flex items-center justify-center mb-2.5 font-bold text-amber-400 text-sm tracking-wider uppercase border border-slate-700/50 shadow-inner group-hover:border-amber-500/30 transition-all duration-300">${channel.name.substring(0,2)}</div>`;
            
            if (channel.logo) {
                logoHtml = `<img src="${channel.logo}" alt="${channel.name}" class="w-14 h-14 object-contain mb-2.5 bg-white p-1.5 rounded-xl shadow-lg border border-slate-800 group-hover:scale-105 transition-all duration-300" onerror="this.outerHTML='<div class=\'w-14 h-14 bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl flex items-center justify-center mb-2.5 font-bold text-amber-400 text-sm\'>${channel.name.substring(0,2)}</div>\''">`;
            }

            btn.innerHTML = `
                ${logoHtml}
                <span class="text-xs font-semibold block truncate w-full tracking-wide text-slate-300 group-hover:text-amber-400 transition-colors duration-300">${channel.name}</span>
            `;
            return btn;
        }

        function displayGrid(channels, gridId) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            channels.forEach(channel => {
                grid.appendChild(createChannelButton(channel));
            });
        }

        // 🎨 ক্যাটাগরি সেকশন টাইটেল ডিজাইন আপগ্রেড
        function renderCategories(categoriesData) {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';

            const sortedCategoryKeys = Object.keys(categoriesData).sort((a, b) => {
                if (a.includes('খেলাধুলা')) return -1;
                if (b.includes('খেলাধুলা')) return 1;
                return a.localeCompare(b);
            });

            let totalChannelsCount = 0;

            sortedCategoryKeys.forEach(catName => {
                const channels = categoriesData[catName];
                if (channels.length === 0) return;

                totalChannelsCount += channels.length;

                const catBlock = document.createElement('div');
                catBlock.className = "bg-[#101626]/30 border border-slate-900/60 p-5 rounded-2xl shadow-xl";
                
                const title = document.createElement('h2');
                title.className = "text-lg font-black mb-5 text-slate-200 flex items-center gap-2 border-l-4 border-rose-500 pl-3 tracking-wide";
                title.innerText = `${catName} (${channels.length})`;
                
                const grid = document.createElement('div');
                grid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4";
                
                channels.forEach(channel => {
                    grid.appendChild(createChannelButton(channel));
                });

                catBlock.appendChild(title);
                catBlock.appendChild(grid);
                container.appendChild(catBlock);
            });

            document.getElementById('channel-count').innerText = totalChannelsCount;
        }

        function changeChannel(streamUrl) {
            if (window.location.protocol === 'https:' && streamUrl.startsWith('http://')) {
                streamUrl = streamUrl.replace('http://', 'https://');
            }

            player.reset(); 

            player.src({
                src: streamUrl,
                type: 'application/x-mpegURL'
            });
            
            player.ready(function() {
                player.play().catch(function(error) {
                    console.log("Play interrupted or stream dead:", error);
                });
            });
        }

        function filterChannels() {
            const searchTxt = document.getElementById('search-box').value.toLowerCase();
            
            const filteredPinned = globalPinned.filter(c => c.name.toLowerCase().includes(searchTxt));
            if(filteredPinned.length > 0 || searchTxt === '') {
                document.getElementById('pinned-section').classList.remove('hidden');
                displayGrid(filteredPinned, 'pinned-grid');
            } else {
                document.getElementById('pinned-section').classList.add('hidden');
            }

            let filteredCats = {};
            for (let cat in globalCategories) {
                const filteredList = globalCategories[cat].filter(c => c.name.toLowerCase().includes(searchTxt));
                if (filteredList.length > 0) {
                    filteredCats[cat] = filteredList;
                }
            }
            renderCategories(filteredCats);
        }

        initPortal();
    </script>
</body>
</html>
